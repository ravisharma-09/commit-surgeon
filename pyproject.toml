[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-surgeon"
version = "0.1.0"
description = "Offline CLI that turns a messy git working tree into small logical commits and a PR description."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "unidiff>=0.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
surgeon = "surgeon.cli:app"

[tool.setuptools]
packages = ["surgeon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
